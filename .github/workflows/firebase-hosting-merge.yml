name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - v0.0.1
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          entryPoint: 'frontend'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_COLORTESTER }}'
          channelId: live
          projectId: colortester
